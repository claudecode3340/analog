<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logic Gates and Delay</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
  onload="renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}]});document.body.dataset.ready='1'"></script>
<style>
:root{--ink:#1f2633;--ink2:#4a5263;--mute:#7b8394;--line:#e3e7ee;--soft:#f6f8fb;
--blue:#2563eb;--blueS:#eef4ff;--orange:#ea580c;--orangeS:#fff6ed;--green:#059669;--greenS:#ecfdf5;
--purple:#7c3aed;--purpleS:#f5f3ff;--red:#dc2626;--redS:#fef2f2;--amber:#b45309;--amberS:#fffbeb}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font-family:Inter,"Segoe UI",system-ui,sans-serif;font-size:15.5px;line-height:1.65}
.wrap{max-width:820px;margin:0 auto;padding:24px 16px 80px}
h1{font-size:38px;line-height:1.1;margin:8px 0 8px;letter-spacing:-.02em}
h2{font-size:26px;margin:56px 0 6px;padding-bottom:8px;border-bottom:2px solid var(--line)}
h3{font-size:19px;margin:32px 0 6px}
h4{font-size:16px;margin:20px 0 4px}
p{margin:10px 0}
.kicker{font-size:12px;letter-spacing:.14em;font-weight:700;color:var(--blue);text-transform:uppercase}
.lede{font-size:17px;color:var(--ink2)}
.box{border-radius:12px;padding:12px 18px;margin:18px 0;border:1px solid var(--line);background:var(--soft);break-inside:avoid}
.box .tag{font-size:11.5px;letter-spacing:.12em;font-weight:750;text-transform:uppercase;display:block;margin-bottom:2px}
.blue{background:var(--blueS);border-color:#cfdcfb}.blue .tag{color:var(--blue)}
.green{background:var(--greenS);border-color:#bfe9d8}.green .tag{color:var(--green)}
.red{background:var(--redS);border-color:#f7c9c9}.red .tag{color:var(--red)}
.purple{background:var(--purpleS);border-color:#ddd3fb}.purple .tag{color:var(--purple)}
.orange{background:var(--orangeS);border-color:#fbd9bd}.orange .tag{color:var(--orange)}
.amber{background:var(--amberS);border-color:#f3e0b5}.amber .tag{color:var(--amber)}
figure{margin:18px 0;text-align:center;break-inside:avoid}
figure svg{max-width:100%;height:auto}
figcaption{font-size:13px;color:var(--ink2);text-align:left;margin-top:4px}
table{border-collapse:collapse;width:100%;font-size:14px;margin:12px 0;break-inside:avoid}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.story{counter-reset:s;list-style:none;padding:0}
.story>li{counter-increment:s;position:relative;padding:8px 0 8px 46px;border-bottom:1px dashed var(--line)}
.story>li::before{content:counter(s);position:absolute;left:0;top:8px;width:32px;height:32px;border-radius:50%;background:var(--blue);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.q{border:2px solid var(--line);border-radius:14px;padding:4px 18px 10px;margin:28px 0}
.q h3{margin-top:14px}
.step{display:grid;grid-template-columns:120px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.step>.lab{font-size:11.5px;font-weight:750;letter-spacing:.08em;text-transform:uppercase;padding-top:3px}
.s1 .lab{color:var(--purple)}.s2 .lab{color:var(--green)}.s3 .lab{color:var(--amber)}.s4 .lab{color:var(--blue)}.s5 .lab{color:var(--red)}
.ans{display:inline-block;background:var(--blueS);border:1px solid #cfdcfb;border-radius:8px;padding:0 8px;font-weight:700;color:var(--blue)}
ol.calc{margin:6px 0;padding-left:22px}ol.calc li{margin:4px 0}
.toc{columns:2;font-size:14px}.toc a{color:var(--ink);text-decoration:none}.toc a:hover{color:var(--blue)}
.small{font-size:13px;color:var(--ink2)}
.katex-display{margin:10px 0;overflow-x:auto;overflow-y:hidden}
@media (max-width:600px){table{display:block;overflow-x:auto;position:relative}.step{grid-template-columns:1fr}.toc{columns:1}h1{font-size:30px}}
@media print{body{font-size:12.5px}.wrap{max-width:none;padding:0}h2{break-before:page;margin-top:0}h2.nobreak{break-before:auto}.q{break-inside:auto}a{color:inherit}}
@page{size:A4;margin:14mm 13mm}
.badge{display:inline-block;font-size:11px;font-weight:750;letter-spacing:.07em;text-transform:uppercase;border-radius:6px;padding:1px 8px;margin-left:8px;vertical-align:middle}
.b-opt{background:#fff6ed;color:#ea580c;border:1px solid #fbd9bd}
.b-in{background:#ecfdf5;color:#059669;border:1px solid #bfe9d8}
.b-beyond{background:#fef2f2;color:#dc2626;border:1px solid #f7c9c9}
.glo td:first-child{white-space:nowrap;font-weight:650}
th .katex{text-transform:none;letter-spacing:0}
@media print{h2,h3,h4{break-after:avoid} table{break-inside:auto} tr{break-inside:avoid}}
</style>
</head>
